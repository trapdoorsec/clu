version: '3.8'

services:
  # CLU malware scanner
  clu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clu-scanner
    user: "1000:1000"
    command: clu watch --poll-interval 30s

    # Mount configuration and data directories
    volumes:
      - ./config.toml:/home/cluuser/config/config.toml:ro
      - ./heuristics.toml:/home/cluuser/config/heuristics.toml:ro
      - clu-cache:/home/cluuser/.cache
      - clu-ollama:/home/cluuser/.ollama

    # Environment variables
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - RUST_LOG=info

    # Network
    networks:
      - clu-network

    # Resource limits for security
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "clu", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      ollama:
        condition: service_healthy

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: clu-ollama
    user: "1000:1000"

    # Mount model data
    volumes:
      - clu-ollama:/home/cluuser/.ollama
      - clu-models:/home/cluuser/.cache/ollama

    # Expose Ollama API
    ports:
      - "11434:11434"

    # Network
    networks:
      - clu-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Named volumes for persistent data
volumes:
  clu-cache:
    driver: local
  clu-ollama:
    driver: local
  clu-models:
    driver: local

# Network for inter-service communication
networks:
  clu-network:
    driver: bridge
