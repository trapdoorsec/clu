version: '3.8'

services:
  # CLU malware scanner
  clu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clu-scanner
    user: "1000:1000"
    command: clu watch --poll-interval 30s

    # Mount configuration and data directories
    volumes:
      # Configuration
      # config.toml: writable (generated by 'clu init')
      # heuristics.toml: read-only (rules are immutable)
      - ./config.toml:/home/cluuser/config/config.toml:rw
      - ./heuristics.toml:/home/cluuser/config/heuristics.toml:ro

      # Ollama models (persistent, shared with ollama service)
      - clu-ollama-models:/home/cluuser/.ollama

      # Note: Results are ephemeral - sent to external log aggregators
      # See config.toml [output] webhook for how to configure ELK/Splunk integration
      # Logs are written to stdout/stderr for docker logs and log drivers

    # Environment variables
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - RUST_LOG=info

    # Logging: Send to external services (ELK, Splunk, etc)
    # Docker's logging drivers forward stdout/stderr to log aggregators
    # Examples:
    #   - awslogs: Amazon CloudWatch
    #   - splunk: Splunk HEC endpoint
    #   - gcplogs: Google Cloud Logging
    #   - awsfirelens: With Fluent Bit/Logstash
    # See: https://docs.docker.com/config/containers/logging/configure/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - clu-network

    # Resource limits for security
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "clu", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      ollama:
        condition: service_healthy

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: clu-ollama
    user: "1000:1000"

    # Mount model data
    volumes:
      - clu-ollama-models:/home/cluuser/.ollama
      - ./data/cache/ollama:/home/cluuser/.cache/ollama:rw

    # Expose Ollama API
    ports:
      - "11434:11434"

    # Network
    networks:
      - clu-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Named volumes for persistent data
volumes:
  # Ollama models (only this is a named volume - config is read-only)
  clu-ollama-models:
    driver: local

# Network for inter-service communication
networks:
  clu-network:
    driver: bridge
