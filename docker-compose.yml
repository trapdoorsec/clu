services:
  # CLU malware scanner
  clu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clu-scanner
    user: "1000:1000"
    command: clu watch --poll-interval 30s

    # Mount configuration and data directories
    volumes:
      # Configuration
      # config.toml: writable (generated by 'clu init')
      # heuristics.toml: read-only (rules are immutable)
      - ./config.toml:/home/cluuser/config.toml:rw
      - ./heuristics.toml:/home/cluuser/heuristics.toml:ro

      # Ollama models (persistent, shared with ollama service)
      - clu-ollama-models:/home/cluuser/.ollama

      # Package cache - shared between GuardDog and LLM analysis
      # GuardDog downloads packages here, LLM can reuse them
      - pip-cache:/tmp/pip-cache

      # Quarantine directory - suspicious packages are preserved here for investigation
      - ./quarantine:/home/cluuser/quarantine

      # Shared SQLite database volume
      - clu-data:/home/cluuser/config/data

      # Note: Results are ephemeral - sent to external log aggregators
      # See config.toml [output] webhook for how to configure ELK/Splunk integration
      # Logs are written to stdout/stderr for docker logs and log drivers

    # Environment variables
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - RUST_LOG=info
      # Shared package cache for GuardDog (via pip) and LLM analysis
      - PIP_CACHE_DIR=/tmp/pip-cache
      - TMPDIR=/tmp

    # Logging: Send to external services (ELK, Splunk, etc)
    # Docker's logging drivers forward stdout/stderr to log aggregators
    # Examples:
    #   - awslogs: Amazon CloudWatch
    #   - splunk: Splunk HEC endpoint
    #   - gcplogs: Google Cloud Logging
    #   - awsfirelens: With Fluent Bit/Logstash
    # See: https://docs.docker.com/config/containers/logging/configure/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - clu-network

    # Resource limits for security
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "clu", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      ollama:
        condition: service_healthy

  # CLU sidecar API for findings triage
  clu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clu-api
    user: "1000:1000"
    command: clu-api

    volumes:
      # Shared config
      - ./config.toml:/home/cluuser/config.toml:ro
      # Shared SQLite database (both scanner and API write here)
      - clu-data:/home/cluuser/config/data

    environment:
      - RUST_LOG=info

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - clu-network

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      - clu

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: clu-ollama

    # Avoid inheriting host/container DNS configs that prefer unreachable IPv6 resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Mount model data
    volumes:
      - clu-ollama-models:/home/ubuntu/.ollama
      - ./data/cache/ollama:/home/ubuntu/.cache/ollama:rw

    # Network
    networks:
      - clu-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Named volumes for persistent data
volumes:
  # Ollama models (persistent across container restarts)
  clu-ollama-models:
    driver: local

  # Package cache (shared between GuardDog and LLM analysis)
  # Allows reusing downloaded packages across analysis stages
  pip-cache:
    driver: local

  # Shared SQLite database (scanner + API)
  clu-data:
    driver: local

# Network for inter-service communication
networks:
  clu-network:
    driver: bridge
