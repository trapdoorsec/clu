[package]
name = "clu"
version = "0.1.0"
edition = "2024"

[lib]
name = "clu"
path = "src/lib.rs"

[[bin]]
name = "clu"
path = "src/main.rs"

[[bin]]
name = "clu-api"
path = "src/bin/clu-api.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "color", "cargo"] }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["default"] }
serde_json = "1.0.148"
levenshtein = "1.0.5"
ollama-rs = "0.3.3"
url = "2.5.7"
clap-cargo = "0.18.3"
rss = "2.0.12"
http = "1.4.0"
toml = "0.9.10"
regex = "1.12.2"
owo-colors = { version = "4.1.0", features = ["supports-colors"] }
rand = "0.8.5"
dialoguer = "0.11.0"
chrono = "0.4"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.0"
walkdir = "2.5"
log = "0.4"
env_logger = "0.11"
zip = "0.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
sha2 = "0.10"
axum = "0.8"
thiserror = "2"
